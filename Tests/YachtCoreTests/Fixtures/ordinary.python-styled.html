<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Y.A.C.H.T. Table</title>
  <style>
    .csv-table-wrap {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 14px;
    }
    .csv-table {
      width: 100%;
      border-collapse: collapse;
      border-spacing: 0px;
    }
    .csv-table th, .csv-table td {
      border: 1px solid #cccccc;
      padding: 8px;
      vertical-align: top;
    }
    .csv-table th {
      background: #f5f5f5;
      color: #222222;
      text-align: left;
    }
    .csv-table td {
      background: #ffffff;
    }
    .csv-table td.num {
      text-align: right;
    }
    .csv-table tbody tr:nth-child(even) td {
      background: #fbfbfb;
    }
    .csv-table tbody tr:hover td {
      background: #f2f8ff;
    }
  </style>
</head>
<body>
  <div class="csv-table-wrap">
    <table class="csv-table table table-bordered table-hover table-condensed">
      <thead><tr><th title="Field #1">Year</th><th title="Field #2">Album details</th><th title="Field #3">Peak chart position</th></tr></thead>
      <tbody>
        <tr><td class="num">1990</td><td>Surprise</td><td>—</td></tr>
        <tr><td class="num">1993</td><td>Deluxe</td><td class="num">35</td></tr>
        <tr><td class="num">1996</td><td>Friction, Baby</td><td class="num">64</td></tr>
        <tr><td class="num">1998</td><td>How Does Your Garden Grow?</td><td class="num">129</td></tr>
        <tr><td class="num">2001</td><td>Closer</td><td class="num">110</td></tr>
        <tr><td class="num">2005</td><td>Before the Robots</td><td class="num">84</td></tr>
        <tr><td class="num">2009</td><td>Paper Empire</td><td class="num">62</td></tr>
        <tr><td class="num">2014</td><td>All Together Now</td><td class="num">43</td></tr>
        <tr><td class="num">2024</td><td>Super Magick</td><td>—</td></tr>
      </tbody>
    </table>
  </div>
</body>
</html>
