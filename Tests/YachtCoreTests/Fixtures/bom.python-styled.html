<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Y.A.C.H.T. Table</title>
  <style>
    .csv-table-wrap {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 14px;
    }
    .csv-table {
      width: 100%;
      border-collapse: collapse;
      border-spacing: 0px;
    }
    .csv-table th, .csv-table td {
      border: 1px solid #cccccc;
      padding: 8px;
      vertical-align: top;
    }
    .csv-table th {
      background: #f5f5f5;
      color: #222222;
      text-align: left;
    }
    .csv-table td {
      background: #ffffff;
    }
    .csv-table td.num {
      text-align: right;
    }
    .csv-table tbody tr:nth-child(even) td {
      background: #fbfbfb;
    }
    .csv-table tbody tr:hover td {
      background: #f2f8ff;
    }
  </style>
</head>
<body>
  <div class="csv-table-wrap">
    <table class="csv-table table table-bordered table-hover table-condensed">
      <thead><tr><th title="Field #1">A</th><th title="Field #2">B</th></tr></thead>
      <tbody>
        <tr><td class="num">1</td><td class="num">2</td></tr>
      </tbody>
    </table>
  </div>
</body>
</html>
