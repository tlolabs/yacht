name: Native cross-platform
on:
  push:
    branches: [main]
    tags: ['v*', '!v1.*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  compliance:
    name: Repository compliance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check platform and dependency metadata
        run: |
          python3 script/check_qt_contract.py
          python3 script/check_platforms.py
          python3 script/dependency_inventory.py --check
          python3 script/check_compliance.py
          python3 script/check_update_contract.py
          python3 script/test_update_release.py
          python3 -O script/test_update_release.py
      - name: Automated accessibility and platform support checks (nonblocking)
        continue-on-error: true
        run: python3 script/test_accessibility.py
  tag-policy:
    name: Release tag policy
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check version and stable tag signature
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 script/check_release_tag.py
  macos:
    name: macOS (${{ matrix.display }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            display: ARM64
            xcode: '26.6'
            arch: arm64
            apple_arch: arm64
            triple: aarch64-apple-darwin
          # Avoid the iconservicesagent/Metal crash observed on macos-26-intel.
          - runner: macos-15-intel
            display: x64
            xcode: '26.3'
            arch: x64
            apple_arch: x86_64
            triple: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          targets: ${{ matrix.triple }}
          components: rustfmt,clippy
      - name: Verify native runner architecture
        run: test "$(uname -m)" = '${{ matrix.apple_arch }}'
      - name: Rust quality gates
        run: cargo fmt --all --check && cargo clippy --workspace --all-targets --locked -- -D warnings && cargo test --workspace --locked
      - name: Verify generated files
        run: python3 script/sync_version.py && python3 script/generate_project.py && git diff --exit-code -- Yacht.xcodeproj platform/macos/Support/Info.plist platform/windows/Version.props platform/windows/app.manifest
      - name: Pinned Sparkle authentication tools
        run: |
          ./script/prepare_sparkle.sh
          python3 script/test_sparkle_tools.py build/sparkle/2.9.6/bin
      - name: Swift binding tests
        run: ./script/build_rust_macos.sh && swift test
      - name: CLI compatibility regressions
        run: python3 script/verify_compatibility.py
      - name: Native ctypes binding tests
        run: cargo build --workspace --locked && python3 script/test_native_binding.py target/debug/libyacht_ffi.dylib
      - name: macOS UI tests
        run: xcodebuild -project Yacht.xcodeproj -scheme Yacht -derivedDataPath build -destination 'platform=macOS,arch=${{ matrix.apple_arch }}' -resultBundlePath build/UITests.xcresult test -quiet
      - name: Package native macOS development build
        if: github.event_name != 'schedule' || matrix.arch == 'arm64'
        run: ./script/package.sh --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macOS-${{ matrix.arch }}-UI-test-results
          path: build/UITests.xcresult
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'schedule' || matrix.arch == 'arm64'
        with:
          name: YACHT-macos-${{ matrix.arch }}-${{ github.sha }}
          path: |
            release/YACHT-macos-${{ matrix.arch }}.zip
            release/yacht-macos-${{ matrix.arch }}
            release/SHA256SUMS-macos-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 30
  windows:
    name: Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x64
            triple: x86_64-pc-windows-msvc
            platform: x64
          - runner: windows-11-arm
            arch: arm64
            triple: aarch64-pc-windows-msvc
            platform: ARM64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          targets: ${{ matrix.triple }}
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rust and CLI compatibility
        shell: bash
        run: cargo test --workspace --locked && python script/verify_compatibility.py
      - name: Build library and Qt integration tests
        shell: pwsh
        run: |
          cargo build --workspace --locked --release --target ${{ matrix.triple }}
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake -S platform/qt -B build/qt -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/qt --config Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item target/${{ matrix.triple }}/release/yacht_ffi.dll build/qt/tests/Release/ -ErrorAction SilentlyContinue
          Copy-Item target/${{ matrix.triple }}/release/yacht_ffi.dll build/qt/tests/ -ErrorAction SilentlyContinue
          $testExe = if (Test-Path build/qt/tests/Release/test_integration.exe) { "build/qt/tests/Release/test_integration.exe" } else { "build/qt/tests/test_integration.exe" }
          & $testExe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python script/test_native_binding.py target/${{ matrix.triple }}/release/yacht_ffi.dll
      - name: Ensure Inno Setup
        if: github.event_name != 'schedule'
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y; if ($LASTEXITCODE) { exit $LASTEXITCODE } }
      - name: Package native Windows application
        if: github.event_name != 'schedule'
        shell: pwsh
        run: ./script/package_windows.ps1 -Architecture ${{ matrix.arch }}
      - name: Publish native Windows application for scheduled UI test
        if: github.event_name == 'schedule'
        shell: pwsh
        run: ./script/package_windows.ps1 -Architecture ${{ matrix.arch }} -BuildOnly
      - name: Qt runtime integration
        shell: pwsh
        run: ./platform/windows/test_ui.ps1 -Executable "$PWD/target/windows-${{ matrix.arch }}/YachtApp.exe"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'schedule'
        with:
          name: YACHT-windows-${{ matrix.arch }}-${{ github.sha }}
          path: |
            release/YACHT-*-windows-*
            release/SHA256SUMS-windows-*
          if-no-files-found: error
          retention-days: 30
  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
      - name: Install native runtime, Qt and UI test dependencies
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev qt6-base-private-dev libqt6widgets6t64 libqt6gui6t64 libqt6core6t64 libqt6network6t64 xdg-utils xvfb dbus-x11 at-spi2-core desktop-file-utils apparmor
      - name: Rust, CLI and native binding tests
        run: |
          cargo test --workspace --locked
          python3 script/verify_compatibility.py
          cargo build --workspace --locked
          python3 script/test_native_binding.py target/debug/libyacht_ffi.so
      - name: Shared presentation and native Qt integration
        run: |
          cmake -S platform/qt -B build/qt-linux -DCMAKE_BUILD_TYPE=Release
          cmake --build build/qt-linux --target test_integration YachtApp
          cp target/debug/libyacht_ffi.so build/qt-linux/tests/
          cp target/debug/libyacht_ffi.so build/qt-linux/
          ./build/qt-linux/tests/test_integration
          xvfb-run -a dbus-run-session -- python3 script/test_qt_ui.py build/qt-linux/YachtApp
      - name: Package and validate Linux artifacts
        if: github.event_name != 'schedule'
        run: |
          desktop-file-validate platform/linux/data/*.desktop
          ./script/package_linux.sh
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'schedule'
        with:
          name: YACHT-linux-${{ matrix.arch }}-${{ github.sha }}
          path: |
            release/YACHT-*-linux-*
            release/SHA256SUMS-linux-*
          if-no-files-found: error
          retention-days: 30

  qt-macos-internal:
    name: Qt INTERNAL reference (macOS ARM64)
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          targets: aarch64-apple-darwin
      - name: Install Qt 6
        run: brew install qt@6
      - name: Build isolated internal reference application
        run: |
          export PATH="/opt/homebrew/opt/qt@6/bin:$PATH"
          export CMAKE_PREFIX_PATH="/opt/homebrew/opt/qt@6:$CMAKE_PREFIX_PATH"
          ./script/package_qt_internal.sh
      - name: Shared presentation tests
        run: |
          export PATH="/opt/homebrew/opt/qt@6/bin:$PATH"
          export CMAKE_PREFIX_PATH="/opt/homebrew/opt/qt@6:$CMAKE_PREFIX_PATH"
          cmake -S platform/qt -B build/qt-test -DCMAKE_BUILD_TYPE=Release
          cmake --build build/qt-test --target test_integration
          ./build/qt-test/tests/test_integration
      - name: Native preview and application smoke tests
        run: python3 script/test_qt_ui.py 'dist/internal/YACHT Qt Internal.app/Contents/MacOS/YachtApp'
      - name: Enforce production release isolation
        run: python3 script/check_qt_contract.py --bundle 'dist/internal/YACHT Qt Internal.app'
      # Workflow artifacts only; never a GitHub Release asset or production feed.
      - uses: actions/upload-artifact@v4
        with:
          name: YACHT-Qt-INTERNAL-macos-arm64-${{ github.sha }}
          path: build/internal-artifacts/YACHT-Qt-INTERNAL-macos-arm64.zip
          if-no-files-found: error
          retention-days: 14
