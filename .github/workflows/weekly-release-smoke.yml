name: Weekly tagged-release smoke
on:
  schedule:
    # Sunday 08:17 PST / 09:17 PDT. GitHub schedules may start later.
    - cron: '17 16 * * 0'
permissions:
  contents: read
concurrency:
  group: weekly-tagged-release-smoke
  cancel-in-progress: false
jobs:
  select:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
      actions: read
    outputs:
      matrix: ${{ steps.tags.outputs.matrix }}
      has_new: ${{ steps.tags.outputs.has_new }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - id: tags
        name: Select and claim new version tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 control/.github/scripts/weekly_release_smoke.py select
          --pattern '^v[0-9]+\.[0-9]+\.[0-9]+(?:-(?:beta|rc)\.[0-9]+)?$'
          --baseline-file control/.github/weekly-smoke-baseline.json
          --targets linux-x64,linux-arm64,windows-x64,windows-arm64 --require-mac-release --claim
  smoke:
    name: Smoke ${{ matrix.tag }} (${{ matrix.target }})
    needs: select
    if: github.run_attempt == 1 && needs.select.outputs.has_new == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ${{ matrix.target == 'linux-x64' && 'ubuntu-24.04' || matrix.target == 'linux-arm64' && 'ubuntu-24.04-arm' || matrix.target == 'windows-arm64' && 'windows-11-arm' || 'windows-2025' }}
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: source
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
      ARCH: ${{ endsWith(matrix.target, 'arm64') && 'arm64' || 'x64' }}
      RUST_TARGET: ${{ endsWith(matrix.target, 'arm64') && 'aarch64-pc-windows-msvc' || 'x86_64-pc-windows-msvc' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.sha }}
          path: source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: ${{ runner.os == 'Windows' && env.RUST_TARGET || '' }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Linux native prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build qt6-base-dev qt6-base-private-dev qt6-qpa-plugins libnotify-dev xvfb dbus-x11
      - uses: jurplel/install-qt-action@v4
        if: runner.os == 'Windows'
        with:
          version: '6.8.0'
          host: ${{ endsWith(matrix.target, 'arm64') && 'windows_arm64' || 'windows' }}
          target: desktop
          arch: ${{ endsWith(matrix.target, 'arm64') && 'win64_msvc2022_arm64' || 'win64_msvc2022_64' }}
      - name: Package Linux from the tagged source
        if: runner.os == 'Linux'
        run: |
          ./script/package_linux.sh
          mkdir -p verified-extract
          tar -xzf release/YACHT-*-linux-"${ARCH}".tar.gz -C verified-extract
          dpkg-deb -x release/YACHT-*-linux-"${ARCH}".deb verified-deb
          verified-deb/usr/bin/yacht --help
          xvfb-run -a dbus-run-session -- python3 ../control/.github/scripts/launch_smoke.py verified-deb/usr/lib/yacht/YachtApp
          verified-extract/bin/yacht --help
          xvfb-run -a dbus-run-session -- python3 ../control/.github/scripts/launch_smoke.py verified-extract/lib/yacht/YachtApp
      - name: Package and smoke Windows from the tagged source
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cmakeArch = if ($env:ARCH -eq 'arm64') { 'ARM64' } else { 'x64' }
          cmake -S platform/qt -B "build/qt-$env:ARCH" -A $cmakeArch "-DYACHT_FFI_LIB=$PWD/target/$env:RUST_TARGET/release/yacht_ffi.dll.lib"
          if ($LASTEXITCODE) { throw 'Qt configure failed' }
          ./script/package_windows.ps1 -Architecture $env:ARCH
          if ($LASTEXITCODE) { throw 'Windows packaging failed' }
          $setup = @(Get-ChildItem "release/YACHT-*-windows-$env:ARCH-setup.exe")
          if ($setup.Count -ne 1) { throw 'Expected exactly one installer' }
          $installDir = Join-Path $env:RUNNER_TEMP 'yacht-weekly-install'
          $install = Start-Process $setup[0].FullName -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$installDir`"") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw 'Installer smoke failed' }
          & "$installDir/yacht.exe" --help
          if ($LASTEXITCODE) { throw 'Installed CLI failed' }
          Expand-Archive "release/YACHT-*-windows-$env:ARCH.zip" verified-extract
          & ./verified-extract/yacht.exe --help
          if ($LASTEXITCODE) { throw 'Packaged CLI failed' }
          Remove-Item Env:QT_PLUGIN_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:QT_QPA_PLATFORM_PLUGIN_PATH -ErrorAction SilentlyContinue
          $env:PATH = "$env:SystemRoot/System32;$env:SystemRoot"
          & "$env:pythonLocation/python.exe" ../control/.github/scripts/launch_smoke.py verified-extract/YachtApp.exe
          if ($LASTEXITCODE) { throw 'Packaged GUI failed' }
          & "$env:pythonLocation/python.exe" ../control/.github/scripts/launch_smoke.py "$installDir/YachtApp.exe"
          if ($LASTEXITCODE) { throw 'Installed GUI failed' }
      - name: Validate package and bind checksums to this tag and run
        env:
          RELEASE_TAG: ${{ matrix.tag }}
          RELEASE_SHA: ${{ matrix.sha }}
          RELEASE_TARGET: ${{ matrix.target }}
        shell: bash
        run: python ../control/.github/scripts/weekly_publish.py prepare --source . --directory release
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-${{ matrix.tag }}-${{ matrix.target }}
          path: source/release/*
          if-no-files-found: error
          retention-days: 14
  publish:
    name: Publish ${{ matrix.tag }} (${{ matrix.target }})
    needs: [select, smoke]
    if: always() && github.run_attempt == 1 && needs.select.outputs.has_new == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Find only this successful target's artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: weekly-${{ matrix.tag }}-${{ matrix.target }}
          BUILD_JOB_NAME: Smoke ${{ matrix.tag }} (${{ matrix.target }})
        run: |
          python3 control/.github/scripts/weekly_publish.py find
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: steps.artifact.outputs.found == 'true'
        with:
          ref: ${{ matrix.sha }}
          path: source
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: steps.artifact.outputs.found == 'true'
        with:
          name: weekly-${{ matrix.tag }}-${{ matrix.target }}
          path: packages
      - name: Publish verified assets without changing release channel or Latest
        if: steps.artifact.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ matrix.tag }}
          RELEASE_SHA: ${{ matrix.sha }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: python3 control/.github/scripts/weekly_publish.py publish --source source --directory packages
  finalize:
    needs: [select, smoke, publish]
    if: always() && github.run_attempt == 1 && needs.select.outputs.has_new == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Record each native target outcome
        env:
          GH_TOKEN: ${{ github.token }}
          SMOKE_MATRIX: ${{ needs.select.outputs.matrix }}
        run: python3 control/.github/scripts/weekly_release_smoke.py finalize --matrix-env SMOKE_MATRIX --require-publication
