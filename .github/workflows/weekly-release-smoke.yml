name: Weekly tagged-release smoke
on:
  schedule:
    # Sunday 08:17 PST / 09:17 PDT. GitHub schedules may start later.
    - cron: '17 16 * * 0'
permissions:
  contents: read
concurrency:
  group: weekly-tagged-release-smoke
  cancel-in-progress: false
jobs:
  select:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
      actions: read
    outputs:
      matrix: ${{ steps.tags.outputs.matrix }}
      has_new: ${{ steps.tags.outputs.has_new }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - id: tags
        name: Select and claim new version tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 control/.github/scripts/weekly_release_smoke.py select
          --pattern '^v[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$'
          --baseline-file control/.github/weekly-smoke-baseline.json
          --targets linux-x64,linux-arm64,windows-x64,windows-arm64 --claim
  smoke:
    name: Smoke ${{ matrix.tag }} (${{ matrix.target }})
    needs: select
    if: github.run_attempt == 1 && needs.select.outputs.has_new == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ${{ matrix.target == 'linux-x64' && 'ubuntu-24.04' || matrix.target == 'linux-arm64' && 'ubuntu-24.04-arm' || matrix.target == 'windows-arm64' && 'windows-11-arm' || 'windows-2025' }}
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: source
    env:
      ARCH: ${{ endsWith(matrix.target, 'arm64') && 'arm64' || 'x64' }}
      RUST_TARGET: ${{ endsWith(matrix.target, 'arm64') && 'aarch64-pc-windows-msvc' || 'x86_64-pc-windows-msvc' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.sha }}
          path: source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          targets: ${{ runner.os == 'Windows' && env.RUST_TARGET || '' }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Linux native prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build qt6-base-dev qt6-base-private-dev qt6-qpa-plugins libnotify-dev xvfb dbus-x11
      - uses: jurplel/install-qt-action@v4
        if: runner.os == 'Windows'
        with:
          version: '6.8.0'
          host: ${{ endsWith(matrix.target, 'arm64') && 'windows_arm64' || 'windows' }}
          target: desktop
          arch: ${{ endsWith(matrix.target, 'arm64') && 'win64_msvc2022_arm64' || 'win64_msvc2022_64' }}
      - name: Build Linux library and app
        if: runner.os == 'Linux'
        run: |
          cargo build --workspace --locked --release
          cmake -S platform/qt -B build/weekly-smoke -DCMAKE_BUILD_TYPE=Release -DYACHT_FFI_LIB="$PWD/target/release/libyacht_ffi.so"
          cmake --build build/weekly-smoke --target YachtApp --parallel
          cp target/release/libyacht_ffi.so build/weekly-smoke/
      - name: Linux startup smoke
        if: runner.os == 'Linux'
        timeout-minutes: 2
        run: |
          ./target/release/yacht --help
          xvfb-run -a dbus-run-session -- python3 ../control/.github/scripts/launch_smoke.py build/weekly-smoke/YachtApp
      - name: Build Windows library and app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --workspace --locked --release --target $env:RUST_TARGET
          if ($LASTEXITCODE) { throw 'Rust build failed' }
          $cmakeArch = if ($env:ARCH -eq 'arm64') { 'ARM64' } else { 'x64' }
          cmake -S platform/qt -B build/weekly-smoke -A $cmakeArch "-DYACHT_FFI_LIB=$PWD/target/$env:RUST_TARGET/release/yacht_ffi.dll.lib"
          if ($LASTEXITCODE) { throw 'Qt configure failed' }
          cmake --build build/weekly-smoke --config Release --target YachtApp --parallel
          if ($LASTEXITCODE) { throw 'Qt build failed' }
          Copy-Item "target/$env:RUST_TARGET/release/yacht_ffi.dll" build/weekly-smoke/Release/
      - name: Windows startup smoke
        if: runner.os == 'Windows'
        timeout-minutes: 2
        shell: pwsh
        run: |
          & "target/$env:RUST_TARGET/release/yacht.exe" --help
          if ($LASTEXITCODE) { throw 'CLI startup failed' }
          $env:PATH = "$env:QT_ROOT_DIR/bin;$env:PATH"
          $env:QT_PLUGIN_PATH = "$env:QT_ROOT_DIR/plugins"
          python ../control/.github/scripts/launch_smoke.py build/weekly-smoke/Release/YachtApp.exe
          if ($LASTEXITCODE) { throw 'GUI startup failed' }
  finalize:
    needs: [select, smoke]
    if: always() && github.run_attempt == 1 && needs.select.outputs.has_new == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Record each native target outcome
        env:
          GH_TOKEN: ${{ github.token }}
          SMOKE_MATRIX: ${{ needs.select.outputs.matrix }}
        run: python3 control/.github/scripts/weekly_release_smoke.py finalize --matrix-env SMOKE_MATRIX
