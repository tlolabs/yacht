name: Legacy Python Distributions

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag to publish, for example v1.1.0"
        required: false
        type: string
  push:
    tags:
      - "v1.*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            label: macos-intel
            package: dmg
          - os: macos-14
            label: macos-arm64
            package: dmg
          - os: windows-latest
            label: windows
            package: zip
          - os: ubuntu-latest
            label: linux
            package: tar

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install base Python build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: python -m pip install py2app

      - name: Install PyInstaller build dependencies
        if: runner.os != 'macOS'
        run: python -m pip install pyinstaller

      - name: Verify source compiles
        run: python -m py_compile yacht.py setup.py

      - name: Build macOS app
        if: runner.os == 'macOS'
        run: |
          python setup.py py2app
          mkdir -p release/dmg-root
          cp -R "dist/YACHT.app" release/dmg-root/
          hdiutil create \
            -volname "YACHT" \
            -srcfolder release/dmg-root \
            -ov \
            -format UDZO \
            "release/YACHT-${{ matrix.label }}.dmg"

      - name: Build Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --name "YACHT" --windowed --onefile --add-data "BTE.csv;." yacht.py
          New-Item -ItemType Directory -Force -Path release
          Compress-Archive -Path "dist/YACHTexe" -DestinationPath "release/YACHT-${{ matrix.label }}.zip" -Force

      - name: Build Linux app
        if: runner.os == 'Linux'
        run: |
          pyinstaller --name "YACHT" --onefile --add-data "BTE.csv:." yacht.py
          mkdir -p release/linux
          cp "dist/YACHT" release/linux/
          cp LICENSE README.md release/linux/
          tar -czf "release/YACHT-${{ matrix.label }}.tar.gz" -C release/linux .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YACHT-${{ matrix.label }}
          path: release/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          generate_release_notes: true
          files: release-artifacts/*
