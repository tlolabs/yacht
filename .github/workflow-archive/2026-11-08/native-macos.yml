name: Native cross-platform
on:
  push:
    branches: [main]
    tags: ['v*', '!v1.*']
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  compliance:
    name: Repository compliance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check platform and dependency metadata
        run: |
          python3 script/check_qt_contract.py
          python3 script/check_platforms.py
          python3 script/dependency_inventory.py --check
          python3 script/check_compliance.py
          python3 script/check_update_contract.py
          python3 script/test_ci_report.py
          python3 script/test_release_tag.py
          python3 script/test_publish_release.py
          python3 script/test_update_release.py
          python3 -O script/test_update_release.py
      - name: Automated accessibility and platform support checks (nonblocking)
        continue-on-error: true
        run: python3 script/test_accessibility.py
  tag-policy:
    name: Release tag policy
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check version and stable tag provenance
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 script/check_release_tag.py
  dependency-security:
    name: Rust dependency security audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Audit Rust dependencies against RustSec advisories
        run: cargo install cargo-audit --locked && cargo audit
  initialize-release:
    name: Initialize commit-bound release
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    concurrency:
      group: yacht-release-init-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Create source tag and draft once
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 script/publish_release.py initialize --source-sha "$GITHUB_SHA" --source-ref "$GITHUB_REF" --run-id "$GITHUB_RUN_ID"
  macos-arm64:
    name: macos arm64
    uses: ./.github/workflows/build-macos.yml
    with:
      arch: arm64
  macos-x64:
    name: macos x64
    uses: ./.github/workflows/build-macos.yml
    with:
      arch: x64
  windows-x64:
    name: windows x64
    uses: ./.github/workflows/build-windows.yml
    with:
      arch: x64
  windows-arm64:
    name: windows arm64
    uses: ./.github/workflows/build-windows.yml
    with:
      arch: arm64
  linux-x64:
    name: linux x64
    uses: ./.github/workflows/build-linux.yml
    with:
      arch: x64
  linux-arm64:
    name: linux arm64
    uses: ./.github/workflows/build-linux.yml
    with:
      arch: arm64
  qt-macos-internal:
    name: Qt INTERNAL reference (macOS ARM64)
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          targets: aarch64-apple-darwin
      - name: Install Qt 6
        run: brew install qt@6
      - name: Build isolated internal reference application
        run: |
          export PATH="/opt/homebrew/opt/qt@6/bin:$PATH"
          export CMAKE_PREFIX_PATH="/opt/homebrew/opt/qt@6:$CMAKE_PREFIX_PATH"
          ./script/package_qt_internal.sh
      - name: Shared presentation tests
        run: |
          export PATH="/opt/homebrew/opt/qt@6/bin:$PATH"
          export CMAKE_PREFIX_PATH="/opt/homebrew/opt/qt@6:$CMAKE_PREFIX_PATH"
          cmake -S platform/qt -B build/qt-test -DCMAKE_BUILD_TYPE=Release
          cmake --build build/qt-test --target test_integration
          ./build/qt-test/tests/test_integration
      - name: Native preview and application smoke tests
        run: python3 script/test_qt_ui.py 'dist/internal/YACHT Qt Internal.app/Contents/MacOS/YachtApp'
      - name: Enforce production release isolation
        run: python3 script/check_qt_contract.py --bundle 'dist/internal/YACHT Qt Internal.app'
      # Workflow artifacts only; never a GitHub Release asset or production feed.
      - uses: actions/upload-artifact@v6
        with:
          name: YACHT-Qt-INTERNAL-macos-arm64-${{ github.sha }}
          path: build/internal-artifacts/YACHT-Qt-INTERNAL-macos-arm64.zip
          if-no-files-found: error
          retention-days: 14
  publish-macos-arm64:
    name: Publish macos-arm64
    needs: [macos-arm64, initialize-release]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) &&
      needs.macos-arm64.result == 'success' &&
      needs.initialize-release.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: YACHT-macos-arm64-${{ github.sha }}
          path: release-inputs
      - name: Verify identity and publish this platform
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 script/publish_release.py publish --target macos-arm64 --source-sha "$GITHUB_SHA" --source-ref "$GITHUB_REF" --run-id "$GITHUB_RUN_ID" release-inputs
  publish-macos-x64:
    name: Publish macos-x64
    needs: [macos-x64, initialize-release]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) &&
      needs.macos-x64.result == 'success' &&
      needs.initialize-release.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: YACHT-macos-x64-${{ github.sha }}
          path: release-inputs
      - name: Verify identity and publish this platform
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 script/publish_release.py publish --target macos-x64 --source-sha "$GITHUB_SHA" --source-ref "$GITHUB_REF" --run-id "$GITHUB_RUN_ID" release-inputs
  publish-windows-x64:
    name: Publish windows-x64
    needs: [windows-x64, initialize-release]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) &&
      needs.windows-x64.result == 'success' &&
      needs.initialize-release.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: YACHT-windows-x64-${{ github.sha }}
          path: release-inputs
      - name: Verify identity and publish this platform
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 script/publish_release.py publish --target windows-x64 --source-sha "$GITHUB_SHA" --source-ref "$GITHUB_REF" --run-id "$GITHUB_RUN_ID" release-inputs
  publish-windows-arm64:
    name: Publish windows-arm64
    needs: [windows-arm64, initialize-release]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) &&
      needs.windows-arm64.result == 'success' &&
      needs.initialize-release.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: YACHT-windows-arm64-${{ github.sha }}
          path: release-inputs
      - name: Verify identity and publish this platform
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 script/publish_release.py publish --target windows-arm64 --source-sha "$GITHUB_SHA" --source-ref "$GITHUB_REF" --run-id "$GITHUB_RUN_ID" release-inputs
  publish-linux-x64:
    name: Publish linux-x64
    needs: [linux-x64, initialize-release]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) &&
      needs.linux-x64.result == 'success' &&
      needs.initialize-release.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: YACHT-linux-x64-${{ github.sha }}
          path: release-inputs
      - name: Verify identity and publish this platform
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 script/publish_release.py publish --target linux-x64 --source-sha "$GITHUB_SHA" --source-ref "$GITHUB_REF" --run-id "$GITHUB_RUN_ID" release-inputs
  publish-linux-arm64:
    name: Publish linux-arm64
    needs: [linux-arm64, initialize-release]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) &&
      needs.linux-arm64.result == 'success' &&
      needs.initialize-release.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: YACHT-linux-arm64-${{ github.sha }}
          path: release-inputs
      - name: Verify identity and publish this platform
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 script/publish_release.py publish --target linux-arm64 --source-sha "$GITHUB_SHA" --source-ref "$GITHUB_REF" --run-id "$GITHUB_RUN_ID" release-inputs
  report-failures:
    name: Consolidated CI failure report
    if: ${{ always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
    needs: [compliance, dependency-security, tag-policy, initialize-release, macos-arm64, macos-x64, windows-x64, windows-arm64, linux-x64, linux-arm64, qt-macos-internal, publish-macos-arm64, publish-macos-x64, publish-windows-x64, publish-windows-arm64, publish-linux-x64, publish-linux-arm64]
    runs-on: ubuntu-24.04
    concurrency:
      group: yacht-ci-failure-report
      cancel-in-progress: false
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - name: Update the unresolved CI issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 script/report_ci_failures.py
