[workspace]
members = ["crates/yacht-core", "crates/yacht-cli", "crates/yacht-ffi"]
resolver = "2"
[workspace.package]
version = "2.1.1"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-only"
repository = "https://github.com/tlolabs/yacht"
[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
regex = "1.12"
tempfile = "3.27.0"
thiserror = "2.0.20"
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
