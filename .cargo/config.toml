# Keep Windows packages independent of a separately installed VC++ runtime.
# FFI allocations are created and released by the same Rust library.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
